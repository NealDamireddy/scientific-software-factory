[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labfactory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1,<2",
    "pyjwt>=2.10,<3",
    "starlette>=0.49,<2",
    "turso-serverless==0.1.0",
]

[project.scripts]
labfactory = "labfactory.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/labfactory"]
