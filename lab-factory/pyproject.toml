[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labfactory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2"]

[project.scripts]
labfactory = "labfactory.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/labfactory"]
