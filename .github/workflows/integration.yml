name: EVOLVE integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  science:
    name: Scientific integration (${{ matrix.sandbox }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            sandbox: macOS Seatbelt
          - os: ubuntu-24.04
            sandbox: Linux bubblewrap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bubblewrap for the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by default.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - name: Run full suite with scientific sandbox and loopback instrument (no skips outside PostgreSQL)
        run: uv run --frozen python scripts/run_tests.py
      - name: Verify shared B12 acquisition, retry, archive and replay
        run: uv run --frozen python .sw-factory/WO-16/check_combined.py
      - name: Replay archived B12 releases and score the retained assay
        run: |
          uv run --frozen python -m factory.assays.b12.replay_bundle public/b12/completed.json
          uv run --frozen python -m factory.assays.b12.benchmark public/b12/completed.json --out "$RUNNER_TEMP/b12-scored"
      - name: Verify retained EPR evidence
        run: |
          for report in public/evidence/*/*/report.json; do
            uv run --frozen python -m factory.assays.epr verify "$(dirname "$report")"
          done

  postgres:
    name: PostgreSQL contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13 --extra postgres
      - name: Install PostgreSQL 16 server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Run database contracts on a disposable cluster
        run: uv run --frozen --extra postgres bash tests/fixtures/postgres/run.sh

  web:
    name: Production build and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Install the Python producer for digest verification
        run: uv sync --locked --python 3.13
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: uv run --frozen npm test
      - name: Verify isolated preview and deployment source
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm run build
          npm test -- workspace-access.spec.mjs -g "workspace identifies the source commit"
