name: Lab Factory backend
on:
  pull_request:
    branches: [main]
    paths:
      - 'lab-factory/**'
      - '.github/workflows/lab-factory-backend.yml'
  push:
    branches: [main]
    paths:
      - 'lab-factory/**'
      - '.github/workflows/lab-factory-backend.yml'
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lab-factory
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - run: uv run --frozen pytest -q tests
